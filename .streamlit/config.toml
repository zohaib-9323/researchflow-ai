[server]
# Matches the API's default MAX_UPLOAD_SIZE_MB so the uploader shows the real limit.
maxUploadSize = 20

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#5b47e0"
backgroundColor = "#f7f4ef"
secondaryBackgroundColor = "#efeae2"
textColor = "#1b1724"
