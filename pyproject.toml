[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchflow-ai"
version = "0.1.0"
description = "AI research & document assistant built with LangChain, LangGraph, FAISS and Gemini."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.7,<2",
    "langchain-google-genai>=4.4,<5",
    "langchain-text-splitters>=1.1,<2",
    "langchain-huggingface>=1.2,<2",
    # PyTorch (and therefore sentence-transformers) publishes no wheels for Intel macOS.
    # On that platform run the app through Docker, or use EMBEDDING_PROVIDER=hashing for
    # development only. See README "Platform notes".
    "sentence-transformers>=5.0,<7; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "faiss-cpu>=1.12,<2",
    "numpy>=1.26",
    "pymupdf>=1.26,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0,<3",
    "streamlit[auth]>=1.42,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# PyTorch-free embeddings for small hosts (Streamlit Community Cloud); Linux/Apple silicon.
fastembed = ["fastembed>=0.7,<1"]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires a real Gemini API key and network access (excluded by default)",
]
addopts = "-m 'not live'"
filterwarnings = [
    "ignore::DeprecationWarning:swigfaiss",
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"app/evaluation/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
