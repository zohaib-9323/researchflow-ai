services:
  api:
    build: .
    image: researchflow-ai:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:8501
    volumes:
      - ./data:/app/data
      - hf-cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  ui:
    image: researchflow-ai:latest
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    command:
      - streamlit
      - run
      - frontend/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false

volumes:
  hf-cache:
